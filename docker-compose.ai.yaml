version: '3'

volumes:
  data:
  ollama_data:

networks:
  wren:
    driver: bridge

services:
  ### ECCube4 ##################################
  ollama:
    image: ollama/ollama
    build:
        context: .
        dockerfile: Dockerfile.Ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - backend

  bootstrap:
    image: ghcr.io/canner/wren-bootstrap
    restart: on-failure
    platform: linux/amd64
    environment:
      DATA_PATH: /app/data
    volumes:
      - data:/app/data
    command: /bin/sh /app/init.sh

  wren-engine:
    image: ghcr.io/canner/wren-engine
    restart: on-failure
    platform: linux/amd64
    expose:
      - 8080
      - 7432
    volumes:
      - data:/usr/src/app/etc
      - ./data:/usr/src/app/data
    networks:
      - wren
      - backend
    depends_on:
      - bootstrap

  ibis-server:
    image: ghcr.io/canner/wren-engine-ibis
    restart: on-failure
    platform: linux/amd64
    expose:
      - 8000
    environment:
      WREN_ENGINE_ENDPOINT: http://wren-engine:8080
    networks:
      - wren
      - backend

  wren-ai-service:
    image: ghcr.io/canner/wren-ai-service
    restart: on-failure
    platform: linux/amd64
    expose:
      - 5555
    ports:
      - "5555:5555"
    environment:
      # sometimes the console won't show print messages,
      # using PYTHONUNBUFFERED: 1 can fix this
      PYTHONUNBUFFERED: 1
      CONFIG_PATH: /app/data/config.yaml
    env_file:
      - ./ai/.env
    volumes:
      - ./wren_ai_config.yaml:/app/data/config.yaml
    networks:
      - wren
      - backend
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.11.0
    restart: on-failure
    expose:
      - 6333
      - 6334
    volumes:
      - data:/qdrant/storage
    networks:
      - wren
      - backend

  wren-ui:
    image: ghcr.io/canner/wren-ui
    restart: on-failure
    platform: linux/amd64
    environment:
      DB_TYPE: sqlite
      # /app is the working directory in the container
      SQLITE_FILE: /app/data/db.sqlite3
      WREN_ENGINE_ENDPOINT: http://wren-engine:8080
      WREN_AI_ENDPOINT: http://wren-ai-service:5555
      IBIS_SERVER_ENDPOINT: http://ibis-server:8000
      # this is for telemetry to know the model, i think ai-service might be able to provide a endpoint to get the information
#      GENERATION_MODEL: ${GENERATION_MODEL}
      # telemetry
      WREN_ENGINE_PORT: 8080
#      WREN_AI_SERVICE_VERSION: ${WREN_AI_SERVICE_VERSION}
#      WREN_UI_VERSION: ${WREN_UI_VERSION}
#      WREN_ENGINE_VERSION: ${WREN_ENGINE_VERSION}
      USER_UUID: ${USER_UUID}
#      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
#      POSTHOG_HOST: ${POSTHOG_HOST}
#      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED}
      # client side
      NEXT_PUBLIC_USER_UUID: ${USER_UUID}
#      NEXT_PUBLIC_POSTHOG_API_KEY: ${POSTHOG_API_KEY}
#      NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST}
#      NEXT_PUBLIC_TELEMETRY_ENABLED: ${TELEMETRY_ENABLED}
#      EXPERIMENTAL_ENGINE_RUST_VERSION: ${EXPERIMENTAL_ENGINE_RUST_VERSION}
      # configs
#      WREN_PRODUCT_VERSION: ${WREN_PRODUCT_VERSION}
    ports:
      # HOST_PORT is the port you want to expose to the host machine
      - "3000:3000"
    volumes:
      - data:/app/data
    networks:
      - wren
      - backend
    depends_on:
      - wren-ai-service
      - wren-engine
      - ollama
